name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: 前端（typecheck + build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run build:web

  rust:
    # Windows 跑桌面端测试：无需 Linux 的 webkit2gtk 系统依赖，与本机开发环境一致
    name: 桌面端（cargo test + clippy）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo test --manifest-path app/src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings

  server:
    name: 服务端（mvn test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26
          cache: maven
      - run: mvn -B test --file server/pom.xml
